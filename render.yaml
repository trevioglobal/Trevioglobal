# Free-tier friendly Render Blueprint for the Express API
# Dashboard: https://dashboard.render.com
#
# After create:
# 1. Set env vars in Render (DATABASE_URL from Supabase, JWT_SECRET, CORS_ORIGIN)
# 2. Point Vercel NEXT_PUBLIC_API_URL to this service URL

services:
  - type: web
    name: travelpartner-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev: root npm workspaces omit @types/typescript when NODE_ENV=production
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: (npx prisma migrate deploy || npx prisma db push --skip-generate) && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      # Do not set PORT — Render injects it automatically
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Replace with your real Vercel origin after frontend deploy (no trailing slash)
      - key: CORS_ORIGIN
        value: "https://trevioglobal-frontend.vercel.app"
      # Payments — set real keys in Render dashboard (required for live checkout)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ALLOW_DEMO_PAYMENTS
        value: "true"
      # Email — required for forgot-password / invite emails in production
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: ALLOW_INSECURE_TEMP_PASSWORD_RESPONSE
        value: "false"

